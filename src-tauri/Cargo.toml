[package]
name = "sigf-app"
version = "0.1.4"
edition = "2021"
description = "SIGF: install game mashups in one click, and put every game back with Restore vanilla"
license = "AGPL-3.0-only"
repository = "https://github.com/SIGFAI/sigf-app"
homepage = "https://sigf.ai"
publish = false

[lib]
name = "sigf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# A sigf:// click while the app runs focuses it and forwards the link (docs/RECIPE-FORMAT.md 9.2).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# 7z mod archives (src/install/archive.rs): pure Rust, Apache-2.0; decoders only (no AES: encrypted archives are refused).
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["bzip2", "ppmd", "deflate"] }
thiserror = "2"
sha1 = "0.11.0"
# Mod plans: md5 is the only hash some sources give (src/mods.rs, docs/GAME-HUB.md section 5).
md-5 = "0.11"
# Nexus Mods SSO (src/mods.rs): a blocking websocket on the rustls the app already ships, with the system's roots.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
# Scrubbing bug reports (src/report.rs).
regex = "1"
# In-app updates, signed with the release key (tauri.conf.json plugins.updater; src/update.rs).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# The process list for the updater's "Close your game first" (src/update.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The native "pick your own copy" file dialog, opened by the core (the webview never names a path; src/install/byo.rs).
rfd = { version = "0.17", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# 7z fixtures written by the tests (src/install/archive.rs).
sevenz-rust2 = { version = "=0.20.2", default-features = false, features = ["compress"] }
