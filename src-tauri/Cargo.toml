[package]
name = "sigf-app"
version = "0.1.0"
edition = "2021"
description = "SIGF: install game mashups in one click, and put every game back with Restore vanilla"
license = "AGPL-3.0-only"
repository = "https://github.com/SIGFAI/sigf-app"
homepage = "https://sigf.ai"
publish = false

[lib]
name = "sigf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# A sigf:// click while the app runs focuses it and forwards the link (docs/RECIPE-FORMAT.md 9.2).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror = "2"
sha1 = "0.11.0"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
