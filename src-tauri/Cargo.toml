[package]
name = "sigf-app"
version = "0.1.2"
edition = "2021"
description = "SIGF: install game mashups in one click, and put every game back with Restore vanilla"
license = "AGPL-3.0-only"
repository = "https://github.com/SIGFAI/sigf-app"
homepage = "https://sigf.ai"
publish = false

[lib]
name = "sigf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
# A sigf:// click while the app runs focuses it and forwards the link (docs/RECIPE-FORMAT.md 9.2).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
thiserror = "2"
sha1 = "0.11.0"
base64 = "0.22"
# Scrubbing bug reports (src/report.rs).
regex = "1"
# In-app updates, signed with the release key (tauri.conf.json plugins.updater; src/update.rs).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# The process list for the updater's "Close your game first" (src/update.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The native "pick your own copy" file dialog, opened by the core (the webview never names a path; src/install/byo.rs).
rfd = { version = "0.17", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
